  ## use ===  ansible-playbook ansible_bash.yml --ask-become-pass
  ## to run the bash script by itself

- name: Workstation Setup - Bash Config
  hosts: localhost
  connection: local
  gather_facts: true

  tasks:
    - name: DEBUG - Show Environment
      debug:
        msg: "Sudo User: {{ ansible_env.SUDO_USER | default('NONE') }}"

    - name: Ensure config directory exists
      become: true
      file:
        path: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config"
        state: directory
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0755'

    - name: Pull bash_aliases from git
      become: true
      get_url:
        url: "https://raw.githubusercontent.com/Byetvt/batch2/main/bash_aliases.txt"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_aliases.txt"
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0644'
        force: true
        validate_certs: false
        timeout: 20

    - name: Pull bash_functions from git
      become: true
      get_url:
        url: "https://raw.githubusercontent.com/Byetvt/batch2/main/bash_functions.txt"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_functions.txt"
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0644'
        force: true
        validate_certs: false
        timeout: 20

    - name: Pull bash_notes from git
      become: true
      get_url:
        url: "https://raw.githubusercontent.com/Byetvt/batch2/main/bash_notes.txt"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_notes.txt"
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0644'
        force: true
        validate_certs: false
        timeout: 20

    - name: Create bash_extras in config folder
      become: true
      copy:
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_extras"
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0644'
        content: |
          # Source files from the config directory
          [[ -f /home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_aliases.txt ]] && . /home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_aliases.txt
          [[ -f /home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_functions.txt ]] && . /home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_functions.txt

    - name: Ensure .bashrc sources from the config folder
      become: true
      lineinfile:
        path: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/.bashrc"
        line: "[[ -f /home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_extras ]] && . /home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/bash_extras"
        state: present

    - name: Download zip999.py to ansible-config
      become: true
      get_url:
        url: "https://raw.githubusercontent.com/Byetvt/batch2/main/zip999.py"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/zip999.py"
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0755'

    - name: Copy zip999.py to Nemo scripts if Linux Mint
      become: true
      copy:
        src: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/zip999.py"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/.local/share/nemo/scripts/zip999.py"
        remote_src: true
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0755'
      when: ansible_distribution == 'Linux Mint'         

    - name: Download folder_to_iso.sh to ansible-config
      become: true
      get_url:
        url: "https://raw.githubusercontent.com/Byetvt/batch2/main/folder_to_iso.sh"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/folder_to_iso.sh"
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0755'

    - name: Copy folder_to_iso.sh to Nemo scripts if Linux Mint
      become: true



      copy:
        src: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/ansible-config/folder_to_iso.sh"
        dest: "/home/{{ ansible_env.SUDO_USER | default(ansible_user_id) }}/.local/share/nemo/scripts/folder_to_iso.sh"
        remote_src: true
        owner: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        group: "{{ ansible_env.SUDO_USER | default(ansible_user_id) }}"
        mode: '0755'
      when: ansible_distribution == 'Linux Mint'          

    - name: Set Nemo default view to List View
      community.general.dconf:
        key: "/org/nemo/preferences/default-folder-viewer"
        value: "'list-view'"
        state: present

    - name: Set mouse to left-handed mode
      community.general.dconf:
        key: "/org/cinnamon/desktop/peripherals/mouse/left-handed"
        value: "true"
        state: present

    - name: Create Autostart directory if it does not exist
      ansible.builtin.file:
        path: "~/.config/autostart"
        state: directory
        mode: '0755'

    - name: Set Terminal to open at startup
      ansible.builtin.copy:
        dest: "~/.config/autostart/gnome-terminal.desktop"
        content: |
          [Desktop Entry]
          Type=Application
          Exec=gnome-terminal
          Hidden=false
          NoDisplay=false
          X-GNOME-Autostart-enabled=true
          Name=Terminal
          Comment=Open terminal on login
        mode: '0644'









#---
#- name: Configure Nemo Columns on Mint Systems
#  hosts: localhost
#  connection: local
#  tasks:
    - name: Check if Nemo is installed
      ansible.builtin.command: which nemo
      register: nemo_check
      ignore_errors: true
      changed_when: false

    - name: Apply Nemo MIME column settings
      community.general.dconf:
        key: "/org/nemo/list-view/default-visible-columns"
        value: "['name', 'size', 'type', 'mime_type', 'date_modified']"
        state: present
      # Only run if the OS is Mint OR if the nemo binary was found
      when: >
        ansible_distribution == 'Linux Mint' or 
        nemo_check.rc == 0


    - name: Ensure MIME packages directory exists
      ansible.builtin.file:
        path: "~/.local/share/mime/packages"
        state: directory
        mode: '0755'
      when: nemo_check.rc == 0

    - name: Ensure YAML custom MIME type exists
      ansible.builtin.copy:
        dest: "~/.local/share/mime/packages/user-yaml.xml"
        content: |
          <?xml version="1.0" encoding="UTF-8"?>
          <mime-info xmlns="http://www.freedesktop.org/standards/shared-mime-info">
              <mime-type type="application/x-yaml">
                  <comment>YAML Configuration</comment>
                  <glob pattern="*.yml"/>
                  <glob pattern="*.yaml"/>
                  <sub-class-of type="text/plain"/>
              </mime-type>
          </mime-info>
        mode: '0644'
      when: nemo_check.rc == 0

    - name: Update MIME database
      ansible.builtin.command: update-mime-database ~/.local/share/mime
      when: nemo_check.rc == 0
      changed_when: true










