    - name: Flatpak VLC
      become: false
      flatpak: name=org.videolan.VLC state=present method=user remote=flathub

    - name: Flatpak Amberol
      become: false
      flatpak: name=io.bassi.Amberol state=present method=user remote=flathub

    - name: Flatpak Audacity
      become: false
      flatpak: name=org.audacityteam.Audacity state=present method=user remote=flathub

    - name: Flatpak GIMP
      become: false
      flatpak: name=org.gimp.GIMP state=present method=user remote=flathub

    - name: Flatpak Krita
      become: false
