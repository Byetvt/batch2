# ansible-playbook ansible_gaming_setup.yml -K 
#
---
- name: Install and Initialize Gaming Stack
  hosts: localhost
  connection: local
  become: yes
  vars:
    # Set this to your local username
    target_user: "{{ ansible_env.USER | default('user') }}"

  tasks:
    - name: Ensure correct packages are installed (Debian/Mint/MX)
      apt:
        name: 
          - steam
          - lutris
          - wine
          - winetricks
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure correct packages are installed (Fedora)
      dnf:
        name: 
          - steam
          - lutris
          - wine
        state: present
      when: ansible_os_family == "RedHat"

    - name: Trigger Epic Games Store installation via Lutris (Requires manual 'Install' click)
      become: no
      shell: |
        export DISPLAY=:0
        lutris lutris:epic-games-store &
      async: 60
      poll: 0

    - name: Launch Steam to trigger initial updates (Background)
      become: no
      shell: |
        export DISPLAY=:0
        steam -silent &
      async: 60
      poll: 0

    - name: Launch Lutris to initialize configuration
      become: no
      shell: |
        export DISPLAY=:0
        lutris &
      async: 60
      poll: 0
