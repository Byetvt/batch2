# use this to run the .yml
# normal  ansible-playbook main.yml -i "localhost," -c local -K
# debug   ANSIBLE_LOG_PATH=./ansible_debug.log ansible-playbook main.yml -i "localhost," -c local -K -vvv
#
#
---
# Play 1: Setup, Prompts, and File Verification
- name: Interactive Playbook Runner
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: prompt_dosbox
      prompt: "Run ansible_dosbox.yml? [y/N]"
      private: no
    - name: prompt_wine
      prompt: "Run ansible_wine.yml? [y/N]"
      private: no
    - name: prompt_ai
      prompt: "Run setup_ai_stack.yml? [y/N]"
      private: no
    - name: prompt_report
      prompt: "Run system_report.yml? [y/N]"
      private: no
    - name: prompt_refind
      prompt: "Run build_refind_image.yml? [y/N]"
      private: no

  tasks:
    - name: Save prompt results to global facts
      ansible.builtin.set_fact:
        run_dosbox: "{{ prompt_dosbox }}"
        run_wine: "{{ prompt_wine }}"
        run_ai: "{{ prompt_ai }}"
        run_report: "{{ prompt_report }}"
        run_refind: "{{ prompt_refind }}"

    - name: Check if local-only playbook exists
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/no-git-ansible-local-only/nogit_ansible_local.yml"
      register: local_playbook_stat

# Play 2: Standard Always-Run Imports
- import_playbook: ansible_packages.yml
- import_playbook: ansible_flatpaks.yml
- import_playbook: ansible_bash.yml

# Plays 3-7: Optional Playbook Imports (Full Playbooks)
- import_playbook: ansible_dosbox.yml
  when: hostvars['localhost']['run_dosbox'] | lower == 'y'

- import_playbook: ansible_wine.yml
  when: hostvars['localhost']['run_wine'] | lower == 'y'

- import_playbook: setup_ai_stack.yml
  when: hostvars['localhost']['run_ai'] | lower == 'y'

- import_playbook: system_report.yml
  when: hostvars['localhost']['run_report'] | lower == 'y'

- import_playbook: build_refind_image.yml
  when: hostvars['localhost']['run_refind'] | lower == 'y'

# Play 8: Run Local Tasks
- name: Execute Local-only Configuration
  hosts: localhost
  connection: local
  tasks:
    - name: Include local-only tasks if file exists
      ansible.builtin.include_tasks: "{{ lookup('env', 'HOME') }}/no-git-ansible-local-only/nogit_ansible_local.yml"
      when: hostvars['localhost']['local_playbook_stat']['stat']['exists'] | default(false)

    - name: Notify if local-only file was missing
      ansible.builtin.debug:
        msg: "No_Git local yml file NOT found"
      when: not hostvars['localhost']['local_playbook_stat']['stat']['exists']

# Play 9: Local-only Configuration (Bookmarks)
- import_playbook: "../no-git-ansible-local-only/nogit_generate_bookmarks.yml"

