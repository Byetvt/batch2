---
- name: Workstation Setup - APT Packages round 2
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    cifs_username: "user_goes_here"
    cifs_password: "password_goes_here"
    target_user: "{{ lookup('env', 'USER') | default(ansible_user_id, true) }}"
    gtk_theme: "Mint-Y-Dark"
    icon_theme: "Mint-Y-Dark"
    window_theme: "Mint-Y-Dark"
    cinnamon_theme: "Mint-Y-Dark"

  tasks:
    - name: DEBUG - Environment Info
      debug:
        msg: "User: {{ ansible_user_id }} | Home: {{ ansible_user_dir }}"

    - name: Safety Check Block
      when: ansible_distribution == 'Linux Mint'
      block:
        - name: Search for mintupdate process
          command: pgrep -x "mintUpdate"
          register: update_manager_check
          failed_when: false
          changed_when: false
          check_mode: no

        - name: Handle running Update Manager
          when: update_manager_check.rc == 0
          block:
            - name: Alert user (Desktop)
              command: notify-send "Ansible" "Update Manager active. Stopping."
              failed_when: false

            - name: Alert user (Terminal)
              pause:
                seconds: 15
                prompt: |
                  -------------------------------------------------------
                  WARNING: Mint Update Manager is currently running.
                  To prevent APT lock errors, this playbook will now exit.
                  Please close the Update Manager and run this again.
                  -------------------------------------------------------

            - name: Force Terminate Playbook
              fail:
                msg: "Playbook stopped by safety check: Mint Update Manager is active."

    - name: Continue with setup
      debug:
        msg: "Proceeding with tasks..."

    - name: Install jp2a jpg to ascii
      become: true
      package: name=jp2a state=present
      register: res_jp2a
      ignore_errors: true


###

    - name: Ensure Samba configuration directory exists
      become: true
      ansible.builtin.file:
        path: /etc/samba
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Create credentials file if it does not already exist
      become: true
      ansible.builtin.copy:
        dest: /etc/samba/creds
        content: |
          username={{ cifs_username }}
          password={{ cifs_password }}
        owner: root
        group: root
        mode: '0600'
        force: false


    - name: Check if local mount point directory exists
      ansible.builtin.stat:
        path: /mnt/routershare
      register: mount_point_stat

    - name: Create local mount point directory if it does not exist
      become: true
      ansible.builtin.file:
        path: /mnt/routershare
        state: directory
        owner: "1000"
        group: "1000"
        mode: '0770'
      when: not mount_point_stat.stat.exists

    - name: Mount CIFS share and add to fstab
      become: true
      ansible.posix.mount:
        path: /mnt/routershare
        src: //192.168.50.1/data1
        fstype: cifs
        opts: credentials=/etc/samba/creds,vers=1.0,sec=ntlmssp,uid=1000,gid=1000,file_mode=0770,dir_mode=0770
        state: mounted
      register: res_cifs
      ignore_errors: true

    - name: Ensure GTK bookmarks directory exists for the user
      ansible.builtin.file:
        path: "/home/{{ target_user }}/.config/gtk-3.0"
        state: directory
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0755'

    - name: Add routershare to Nemo bookmarks
      ansible.builtin.lineinfile:
        path: "/home/{{ target_user }}/.config/gtk-3.0/bookmarks"
        line: "file:///mnt/routershare routershare"
        create: true
        owner: "{{ target_user }}"
        group: "{{ target_user }}"
        mode: '0644'















