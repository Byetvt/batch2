###  run my new gsettings.sh script


    - name: Get the active graphical desktop user
      shell: loginctl list-users --no-legend | awk '{print $2}' | head -n 1
      register: desktop_user
      changed_when: false

    - name: Get desktop user UID
      shell: id -u {{ desktop_user.stdout }}
      register: desktop_uid
      changed_when: false

    - name: Run gsettings script as the desktop user
      script: gsettings.sh
      become: yes
      become_user: "{{ desktop_user.stdout }}"
      environment:
        DISPLAY: ":0"
        DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ desktop_uid.stdout }}/bus"
        XDG_RUNTIME_DIR: "/run/user/{{ desktop_uid.stdout }}"



###
    - name: Ensure Geany colorschemes directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/geany/colorschemes"
        state: directory
        mode: '0755'

    - name: Clone geany-themes repository to a temporary location
      ansible.builtin.git:
        repo: 'https://github.com/geany/geany-themes.git'
        dest: /tmp/geany-themes
        update: yes

    - name: Install Geany color schemes
      ansible.builtin.shell: |
        cp /tmp/geany-themes/colorschemes/*.conf {{ ansible_env.HOME }}/.config/geany/colorschemes/
      args:
        executable: /bin/bash
