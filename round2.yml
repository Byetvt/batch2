##################################################################
##Configuring Bash history to append rather than overwrite ensures that commands executed across multiple terminal sessions are preserved without data loss. By default, #closing a ##terminal session can overwrite command history from other concurrent sessions. 

##shopt -s histappend
#Write Commands Immediately 
##force Bash to save every command to the history file immediately after execution
##PROMPT_COMMAND="history -a; $PROMPT_COMMAND"

##################################################################

    - name: Ensure histappend is enabled in bashrc
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: "shopt -s histappend"
        state: present

    - name: Ensure PROMPT_COMMAND saves history immediately
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc"
        line: 'PROMPT_COMMAND="history -a; $PROMPT_COMMAND"'
        state: present

###


    - name: Deploy Geany Configurations
      hosts: localhost
      connection: local
      tasks:
        - name: Ensure target configuration directory exists
          ansible.builtin.file:
            path: "~/.config/geany"
            state: directory
            mode: '0755'

    - name: Copy configuration files to ~/.config/geany
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../configs/geany/"
        dest: "~/.config/geany/"
        mode: '0644'


###





    - name: Package Execution Summary
      vars:
        all_results:
          - { n: 'jp2a', r: "{{ res_jp2a }}" }
          - { n: 'cifs_mount', r: "{{ res_cifs }}" }
      debug:
        msg: "{{ item.n }}: {{ 'FAILED' if item.r.failed else 'SUCCESS' }}"
      loop: "{{ all_results }}"
      loop_control:
        label: "{{ item.n }}"

 

